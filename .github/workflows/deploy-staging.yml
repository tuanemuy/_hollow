name: Deploy (staging)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  STAGE: staging
  NODE_VERSION: "22"
  PNPM_VERSION: "11"

jobs:
  deploy:
    name: Provision + deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://staging.hollow.maku-ja.com

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install sops
        run: |
          curl -sSLo /tmp/sops https://github.com/getsops/sops/releases/download/v3.9.0/sops-v3.9.0.linux.amd64
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops

      - name: Pulumi up (staging)
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: ${{ env.STAGE }}
          work-dir: infra
          upsert: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

      - name: Render wrangler.staging.toml from Pulumi outputs
        run: pnpm infra:render:staging
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Build app
        run: pnpm build

      - name: Apply D1 migrations
        run: pnpm db:apply:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.90.1"
          # Order matters on the first-ever deploy: the top-level
          # Worker and `[env.consumer]` both bind `RELAY` via
          # `[[services]] service = "hollow-staging-relay"`, and
          # Cloudflare rejects the upload with code 10143 when the
          # referenced Worker does not exist yet (Issue #188).
          # Deploy targets that have no service binding first, then
          # consumers of those targets last.
          command: |
            deploy --config wrangler.staging.toml --env relay
            deploy --config wrangler.staging.toml --env pruner
            deploy --config wrangler.staging.toml --env dlq
            deploy --config wrangler.staging.toml --env consumer
            deploy --config wrangler.staging.toml

      - name: Inject secrets (SOPS → wrangler secret bulk)
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DECRYPTED_RAW=$(mktemp)
          DECRYPTED_FILTERED=$(mktemp)
          trap 'rm -f "$DECRYPTED_RAW" "$DECRYPTED_FILTERED"' EXIT
          sops -d infra/secrets/staging.enc.json > "$DECRYPTED_RAW"

          # Fail loudly if `workerSecretSpecs()` and the decrypted JSON
          # disagree on the key set (Issue #203). Runs against the raw
          # file; the script ignores `^_` documentation keys internally.
          pnpm infra:check-secrets:staging -- "$DECRYPTED_RAW"

          # Strip `^_`-prefixed documentation-only keys before bulk-push
          # (Issue #203) so they do not pollute the Cloudflare secret set.
          jq 'with_entries(select(.key | startswith("_") | not))' \
            "$DECRYPTED_RAW" > "$DECRYPTED_FILTERED"

          for env_flag in "" "--env relay" "--env consumer" "--env indexer" "--env pruner" "--env dlq"; do
            # shellcheck disable=SC2086
            pnpm exec wrangler secret bulk "$DECRYPTED_FILTERED" --config wrangler.staging.toml $env_flag
          done
