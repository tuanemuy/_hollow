<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hollow — 設定: プロフィール</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    /* Color: brand */
    --color-accent: oklch(37.1% 0 0);
    --color-accent-hover: oklch(43.9% 0 0);
    --color-accent-pressed: oklch(26.9% 0 0);
    --color-accent-surface: oklch(97% 0 0);
    --color-accent-ink: oklch(26.9% 0 0);

    /* Color: neutral */
    --color-bg: #ffffff;
    --color-surface: #f5f5f7;
    --color-surface-hover: #ececef;
    --color-surface-elevated: #fbfbfd;
    --color-ink: #1d1d1f;
    --color-ink-secondary: #6e6e73;
    --color-ink-tertiary: #86868b;
    --color-hairline: rgba(60,60,67,0.12);
    --color-hairline-strong: rgba(60,60,67,0.18);

    /* Color: semantic */
    --color-success: #1f8f3a;
    --color-success-surface: #e6f4ea;
    --color-warning: #a8580b;
    --color-warning-surface: #fdf3e7;
    --color-error: #c43e3e;
    --color-error-surface: #fbebeb;
    --color-info: var(--color-accent);

    /* Color: publish status */
    --color-status-private: #86868b;
    --color-status-link: #a8580b;
    --color-status-public: #1f8f3a;

    /* Color: code */
    --code-keyword: #aa3e3e;
    --code-string: #2a8c4f;
    --code-comment: var(--color-ink-tertiary);
    --code-function: #5b3da1;
    --code-number: #1d6fd6;

    /* Typography */
    --font-sans: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    --font-mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    --font-heading: var(--font-sans);
    --font-body: var(--font-sans);

    --text-xs: clamp(11px, 0.7vw + 9px, 12px);
    --text-sm: clamp(12px, 0.8vw + 10px, 13px);
    --text-base: clamp(14px, 1vw + 11px, 16px);
    --text-md: clamp(15px, 1vw + 12px, 17px);
    --text-lg: clamp(17px, 1.2vw + 13px, 19px);
    --text-xl: clamp(20px, 1.4vw + 14px, 24px);
    --text-2xl: clamp(24px, 2vw + 16px, 30px);
    --text-3xl: clamp(22px, 4vw, 40px);
    --text-mono: clamp(12.5px, 0.6vw + 11px, 13.5px);

    --weight-light: 300;
    --weight-regular: 400;
    --weight-medium: 500;
    --weight-semibold: 600;

    --leading-tight: 1.2;
    --leading-snug: 1.35;
    --leading-normal: 1.5;
    --leading-relaxed: 1.7;

    --tracking-tightest: -0.022em;
    --tracking-tighter: -0.014em;
    --tracking-tight: -0.008em;
    --tracking-normal: -0.003em;

    /* Spacing */
    --space-0: 0;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-8: 32px;
    --space-10: 40px;
    --space-12: 48px;
    --space-16: 64px;
    --space-20: 80px;

    /* Layout */
    --container-max: 1280px;
    --container-padding: clamp(16px, 4vw, 32px);
    --sidebar-width: 260px;
    --meta-rail-width: 260px;
    --content-max: 760px;
    --header-height: 64px;

    /* Radius */
    --radius-xs: 4px;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-xl: 16px;
    --radius-pill: 980px;
    --radius-full: 9999px;

    /* Shadow */
    --shadow-none: none;
    --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
    --shadow-focus: 0 0 0 4px oklch(37.1% 0 0 / 0.28);

    /* Motion */
    --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
    --ease-decel: cubic-bezier(0, 0, 0.2, 1);
    --ease-accel: cubic-bezier(0.4, 0, 1, 1);
    --duration-fast: 120ms;
    --duration-base: 180ms;
    --duration-slow: 280ms;
    --transition-default: all var(--duration-base) var(--ease-standard);
    --transition-bg: background-color var(--duration-fast) var(--ease-standard);
    --transition-color: color var(--duration-fast) var(--ease-standard);

    /* Header */
    --header-bg: rgba(255,255,255,0.85);
    --header-blur: saturate(180%) blur(20px);

    /* Breakpoints */
    --bp-sm: 640px;
    --bp-md: 768px;
    --bp-lg: 1024px;
    --bp-xl: 1280px;
    --bp-2xl: 1536px;
  }

  html, body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: var(--leading-normal);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    letter-spacing: var(--tracking-normal);
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }


  /* === global mobile fixes (review 001) === */
  button, .btn, .pill-btn, .icon-btn {
    white-space: nowrap;
  }
  /* タッチ床 44px は主要アクション（pill/icon ボタン）に限定する。
     裸の button まで一律に伸ばすと、フィルタチップは膨張してデスクトップより大きく見え、
     正方形のチェックボックス(.note-check)は縦長に潰れる。チップ・選択チェックは
     各々で適切な最小高さを明示するため、ここでは対象を絞る。 */
  @media (max-width: 639px) {
    .pill-btn,
    .icon-btn,
    a.pill-btn,
    [role="button"] {
      min-height: 44px;
    }
    .icon-btn {
      min-width: 44px;
    }
  }
  .doc-title, h1, .page-title, .note-title, .modal-title {
    overflow-wrap: anywhere;
    word-break: break-word;
    min-width: 0;
  }
  a { color: inherit; text-decoration: none; }
  ul, ol { list-style: none; }
  input, textarea { font-family: inherit; }

  :focus-visible { outline: none; box-shadow: var(--shadow-focus); border-radius: inherit; }

  /* ===== Header ===== */
  .header {
    position: sticky; top: 0; z-index: 50;
    background: var(--header-bg);
    backdrop-filter: var(--header-blur);
    -webkit-backdrop-filter: var(--header-blur);
    padding: 14px var(--space-6);
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: var(--space-5);
    border-bottom: 1px solid var(--color-hairline);
  }
  @supports not (backdrop-filter: blur(1px)) {
    .header { background: #fff; }
  }
  .header-left { display: flex; align-items: center; gap: var(--space-3); }
  .menu-btn {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
    color: var(--color-ink);
    transition: var(--transition-bg);
  }
  .menu-btn:hover { background: var(--color-surface); }
  .logo {
    font-size: 21px;
    font-weight: var(--weight-light);
    letter-spacing: var(--tracking-tightest);
    color: var(--color-ink);
  }
  .search { max-width: 460px; width: 100%; margin: 0 auto; position: relative; }
  .search input {
    width: 100%; height: 36px;
    border: none; background: var(--color-surface);
    border-radius: var(--radius-pill);
    padding: 0 16px 0 38px;
    font-size: 14px; color: var(--color-ink);
    outline: none;
    transition: background var(--duration-base) var(--ease-standard);
  }
  .search input::placeholder { color: var(--color-ink-tertiary); }
  .search input:focus { background: var(--color-surface-hover); }
  .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--color-ink-tertiary); pointer-events: none; }
  .header-right { display: flex; align-items: center; gap: var(--space-2); }
  /* ヘッダー操作行は検索 input(36px) に揃える局所例外（#628 ADR-004）。base .pill-btn=40px を上書き。 */
  .header-right .pill-btn { height: 36px; }
  /* 新規作成(text)は desktop ではテキストのみ（アイコンを隠す）。mobile の icon-only 化で表示に戻す。ADR-003/§7.2 */
  .header-right .pill-btn.text .cta-icon { display: none; }
  .pill-btn {
    height: 40px; padding: 0 16px;
    border-radius: var(--radius-pill);
    background: var(--color-surface);
    font-size: 14px; font-weight: var(--weight-medium);
    color: var(--color-ink);
    display: inline-flex; align-items: center; gap: 6px;
    transition: var(--transition-bg);
  }
  .pill-btn:hover { background: var(--color-surface-hover); }
  .pill-btn:active { background: var(--color-hairline); }
  .pill-btn.primary { background: var(--color-accent); color: #fff; }
  .pill-btn.primary:hover { background: var(--color-accent-hover); }
  .pill-btn.primary:active { background: var(--color-accent-pressed); }
  /* text バリアント: 枠なしテキストボタン（#628 ADR-003 案2-B の格下げ secondary） */
  .pill-btn.text {
    background: transparent;
    padding: 0 10px;
    color: var(--color-ink-secondary);
  }
  .pill-btn.text:hover { background: var(--color-surface); color: var(--color-ink); }
  .pill-btn.danger { background: var(--color-error); color: #fff; }
  .pill-btn.danger:hover { background: #b03535; }
  .pill-btn.danger:disabled { background: var(--color-surface); color: var(--color-ink-tertiary); cursor: not-allowed; }
  .icon-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--color-surface);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--color-ink);
    transition: var(--transition-bg);
  }
  .icon-btn:hover { background: var(--color-surface-hover); }
  .avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #c9d3df 0%, #8e99a8 100%);
    color: #fff; font-size: 12px; font-weight: var(--weight-medium);
    display: inline-flex; align-items: center; justify-content: center;
  }

  /* ===== Layout ===== */
  .layout { display: grid; grid-template-columns: 1fr; min-height: calc(100vh - var(--header-height)); }

  /* ===== Sidebar (global) ===== */
  .sidebar { padding: 12px 16px 32px; overflow-y: auto; display: flex; flex-direction: column; }
  .sidebar-section { margin-bottom: 28px; }
  /* user section anchored at bottom (#628 ADR-003: ヘッダーから移設) */
  .sidebar-user {
    margin-top: auto;
    border-top: 1px solid var(--color-hairline);
    padding-top: var(--space-3);
  }
  .user-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px var(--space-2);
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: var(--transition-bg);
    width: 100%;
  }
  .user-row:hover { background: var(--color-surface); }
  .user-meta { min-width: 0; text-align: left; flex: 1; }
  .user-name {
    font-size: var(--text-sm);
    font-weight: var(--weight-medium);
    color: var(--color-ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .user-sub {
    font-size: 11px;
    color: var(--color-ink-tertiary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .user-row .caret { color: var(--color-ink-tertiary); flex-shrink: 0; }
  .sidebar-section-title {
    font-size: 11px; font-weight: var(--weight-medium);
    color: var(--color-ink-tertiary);
    text-transform: uppercase; letter-spacing: 0.06em;
    padding: 0 12px; margin-bottom: 6px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 12px;
    border-radius: var(--radius-md);
    font-size: 14px;
    color: var(--color-ink);
    cursor: pointer;
    transition: background var(--duration-fast) var(--ease-standard);
    user-select: none;
  }
  .nav-item:hover { background: var(--color-surface); }
  .nav-item.active { background: var(--color-surface); font-weight: var(--weight-medium); }
  .nav-item svg { color: var(--color-ink-secondary); flex-shrink: 0; }
  .nav-item.active svg { color: var(--color-ink); }
  .nav-item .count { margin-left: auto; font-size: 12px; color: var(--color-ink-tertiary); }
  .tree-child { padding-left: 22px; }
  .tree-toggle { width: 14px; height: 14px; display: inline-flex; align-items: center; justify-content: center; color: var(--color-ink-tertiary); transition: transform 0.2s ease; }
  .tree-toggle.open { transform: rotate(90deg); }

  .sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.2); z-index: 90; opacity: 0; transition: opacity 0.2s ease; }
  .sidebar-backdrop.open { display: block; opacity: 1; }

  /* 「すべてのノートに戻る」: 設定シェルから抜ける明示的な導線。
     左サイドバーが設定ナビに差し替わっているため、ロゴ以外の戻り口を上部に置く。 */
  .sidebar-back {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    margin-bottom: 20px;
    border-radius: var(--radius-md);
    font-size: 13px;
    color: var(--color-ink-secondary);
    transition: var(--transition-bg);
  }
  .sidebar-back:hover { background: var(--color-surface); color: var(--color-ink); }
  .sidebar-back svg { flex-shrink: 0; }

  /* ===== Settings layout: 左サイドバーを設定ナビに差し替え、主コンテンツは単一カラム =====
     (§2.4) アプリ共通シェルの .main と同型。settings-grid / settings-header のような専用骨格は設けない。 */
  .main {
    padding: var(--space-8) var(--space-6) 100px;
    max-width: 760px;
    margin: 0 auto;
    width: 100%;
  }

  .settings-content {
    width: 100%;
  }

  .settings-section + .settings-section {
    margin-top: var(--space-12);
    padding-top: var(--space-10);
    border-top: 1px solid var(--color-hairline);
  }

  .section-title {
    font-size: var(--text-xl);
    font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tighter);
    color: var(--color-ink);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-desc {
    font-size: var(--text-sm);
    color: var(--color-ink-secondary);
    line-height: var(--leading-normal);
    margin-bottom: var(--space-6);
  }

  /* Form field */
  .field { margin-bottom: var(--space-6); }
  .field-label {
    display: block;
    font-size: var(--text-sm);
    font-weight: var(--weight-medium);
    color: var(--color-ink-secondary);
    margin-bottom: 6px;
  }
  .field-help {
    font-size: 12px;
    color: var(--color-ink-tertiary);
    margin-top: 6px;
    line-height: var(--leading-normal);
  }
  .field-help.warning { color: var(--color-warning); }
  .field-help.error { color: var(--color-error); }
  /* fieldControl 原型（common/styles.ts）: surface 背景・透明ボーダー・h-10、
     focus で白背景＋アクセントボーダー。box-shadow フォーカスリングは
     :focus-visible 共通ルールが担う。 */
  .input, .textarea {
    width: 100%;
    height: 40px;
    border: 1px solid transparent;
    background: var(--color-surface);
    color: var(--color-ink);
    border-radius: var(--radius-md);
    padding: 10px 12px;
    font-size: var(--text-sm);
    outline: none;
    transition: border-color var(--duration-fast) var(--ease-standard), background-color var(--duration-fast) var(--ease-standard);
  }
  .input:focus, .textarea:focus { border-color: var(--color-accent); background: var(--color-bg); }
  .input.error, .textarea.error { border-color: var(--color-error); }
  .input::placeholder, .textarea::placeholder { color: var(--color-ink-tertiary); }
  .textarea {
    height: auto;
    min-height: 96px;
    resize: vertical;
    line-height: var(--leading-normal);
  }
  .input-group {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--color-hairline-strong);
    border-radius: var(--radius-md);
    overflow: hidden;
    transition: border-color var(--duration-fast) var(--ease-standard), box-shadow var(--duration-fast) var(--ease-standard);
  }
  .input-group:hover { border-color: var(--color-ink-tertiary); }
  .input-group:focus-within { border-color: var(--color-accent); box-shadow: var(--shadow-focus); }
  .input-group .prefix {
    padding: 10px 12px;
    background: var(--color-surface);
    color: var(--color-ink-secondary);
    font-size: 13px;
    border-right: 1px solid var(--color-hairline);
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
  }
  .input-group input {
    flex: 1;
    border: none;
    padding: 10px 12px;
    font-size: 14px;
    background: transparent;
    color: var(--color-ink);
    outline: none;
  }
  .char-counter {
    font-size: 11px;
    color: var(--color-ink-tertiary);
    text-align: right;
    margin-top: 4px;
  }
  .char-counter.near { color: var(--color-warning); }

  /* Avatar block */
  .avatar-row {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: var(--space-6);
  }
  .avatar-large {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, #c9d3df 0%, #8e99a8 100%);
    color: #fff;
    font-size: 28px;
    font-weight: var(--weight-light);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .avatar-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-sm {
    height: 32px;
    padding: 0 14px;
    border-radius: var(--radius-pill);
    background: var(--color-surface);
    font-size: 13px;
    font-weight: var(--weight-medium);
    color: var(--color-ink);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: var(--transition-bg);
  }
  .btn-sm:hover { background: var(--color-surface-hover); }
  .btn-sm.subtle { color: var(--color-ink-secondary); background: transparent; }
  .btn-sm.subtle:hover { background: var(--color-surface); color: var(--color-ink); }
  .btn-sm.danger-text { color: var(--color-error); }
  .btn-sm.danger-text:hover { background: var(--color-error-surface); }

  .preview-line {
    margin-top: 8px;
    padding: 10px 12px;
    background: var(--color-surface);
    border-radius: var(--radius-md);
    font-family: var(--font-mono);
    font-size: var(--text-mono);
    color: var(--color-ink-secondary);
    word-break: break-all;
  }
  .preview-line strong { color: var(--color-ink); font-weight: var(--weight-medium); }

  .external-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--color-accent);
    font-size: 13px;
    font-weight: var(--weight-medium);
    padding: 6px 0;
    transition: var(--transition-color);
  }
  .external-link:hover { color: var(--color-accent-hover); text-decoration: underline; text-underline-offset: 3px; }

  /* Action row at bottom */
  .action-row {
    margin-top: var(--space-10);
    padding-top: var(--space-6);
    border-top: 1px solid var(--color-hairline);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .action-row .spacer { flex: 1; }

  /* ===== Responsive ===== */
  @media (max-width: 1023px) {
    .sidebar {
      position: fixed; top: 0; bottom: 0; left: 0;
      width: 280px;
      background: #fff;
      z-index: 100;
      transform: translateX(-100%);
      transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
      box-shadow: var(--shadow-md);
      padding-top: 20px;
    }
    .sidebar.open { transform: translateX(0); }
  }

  @media (min-width: 1024px) {
    .layout { grid-template-columns: var(--sidebar-width) 1fr; }
    .menu-btn { display: none; }
    .sidebar {
      border-right: 1px solid var(--color-hairline);
      padding-top: 20px;
      position: sticky;
      top: var(--header-height);
      height: calc(100vh - var(--header-height));
    }
    .main { padding: 56px 48px 120px; }
  }

  @media (min-width: 1280px) {
    .main { padding-left: 64px; padding-right: 64px; padding-top: 64px; }
  }

  @media (max-width: 640px) {
    .header { padding: 12px 16px; gap: 10px; }
    .logo { display: none; }
    /* モバイル: ヘッダー右の両CTAをアイコンのみ・36px角に（検索 input 36px に揃える。#628 ADR-003/004） */
    .header-right .pill-btn span.label { display: none; }
    .header-right .pill-btn { width: 36px; height: 36px; min-height: 36px; padding: 0; justify-content: center; }
    /* 新規作成はモバイルでのみアイコン表示（desktop はテキストのみ。ADR-003/§7.2） */
    .header-right .pill-btn.text .cta-icon { display: inline-flex; }
    /* 新規作成(text)はモバイルでは surface 表示にする（アップロード=accent との対比。確定ドラフト準拠） */
    .header-right .pill-btn.text { background: var(--color-surface); color: var(--color-ink); }
    .header-right .pill-btn.text:hover { background: var(--color-surface-hover); }
