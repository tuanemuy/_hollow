<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hollow — パスワードを再設定</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-accent: oklch(37.1% 0 0);
    --color-accent-hover: oklch(43.9% 0 0);
    --color-accent-pressed: oklch(26.9% 0 0);
    --color-accent-surface: oklch(97% 0 0);
    --color-accent-ink: oklch(26.9% 0 0);

    --color-bg: #ffffff;
    --color-surface: #f5f5f7;
    --color-surface-hover: #ececef;
    --color-surface-elevated: #fbfbfd;
    --color-ink: #1d1d1f;
    --color-ink-secondary: #6e6e73;
    --color-ink-tertiary: #86868b;
    --color-hairline: rgba(60,60,67,0.12);
    --color-hairline-strong: rgba(60,60,67,0.18);

    --color-success: #1f8f3a;
    --color-success-surface: #e6f4ea;
    --color-warning: #a8580b;
    --color-warning-surface: #fdf3e7;
    --color-error: #c43e3e;
    --color-error-surface: #fbebeb;
    --color-info: var(--color-accent);

    --color-status-private: #86868b;
    --color-status-link: #a8580b;
    --color-status-public: #1f8f3a;

    --code-keyword: #aa3e3e;
    --code-string: #2a8c4f;
    --code-comment: var(--color-ink-tertiary);
    --code-function: #5b3da1;
    --code-number: #1d6fd6;

    --font-sans: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    --font-mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    --font-heading: var(--font-sans);
    --font-body: var(--font-sans);

    --text-xs: clamp(11px, 0.7vw + 9px, 12px);
    --text-sm: clamp(12px, 0.8vw + 10px, 13px);
    --text-base: clamp(14px, 1vw + 11px, 16px);
    --text-md: clamp(15px, 1vw + 12px, 17px);
    --text-lg: clamp(17px, 1.2vw + 13px, 19px);
    --text-xl: clamp(20px, 1.4vw + 14px, 24px);
    --text-2xl: clamp(24px, 2vw + 16px, 30px);
    --text-3xl: clamp(22px, 4vw, 40px);
    --text-mono: clamp(12.5px, 0.6vw + 11px, 13.5px);

    --weight-light: 300;
    --weight-regular: 400;
    --weight-medium: 500;
    --weight-semibold: 600;

    --leading-tight: 1.2;
    --leading-snug: 1.35;
    --leading-normal: 1.5;
    --leading-relaxed: 1.7;

    --tracking-tightest: -0.022em;
    --tracking-tighter: -0.014em;
    --tracking-tight: -0.008em;
    --tracking-normal: -0.003em;

    --space-0: 0;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-8: 32px;
    --space-10: 40px;
    --space-12: 48px;
    --space-16: 64px;
    --space-20: 80px;

    --container-max: 1280px;
    --container-padding: clamp(16px, 4vw, 32px);
    --sidebar-width: 260px;
    --meta-rail-width: 260px;
    --content-max: 760px;
    --header-height: 64px;

    --radius-xs: 4px;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-xl: 16px;
    --radius-pill: 980px;
    --radius-full: 9999px;

    --shadow-none: none;
    --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
    --shadow-focus: 0 0 0 4px oklch(37.1% 0 0 / 0.28);

    --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
    --ease-decel: cubic-bezier(0, 0, 0.2, 1);
    --ease-accel: cubic-bezier(0.4, 0, 1, 1);
    --duration-fast: 120ms;
    --duration-base: 180ms;
    --duration-slow: 280ms;
    --transition-default: all var(--duration-base) var(--ease-standard);
    --transition-bg: background-color var(--duration-fast) var(--ease-standard);
    --transition-color: color var(--duration-fast) var(--ease-standard);

    --header-bg: rgba(255,255,255,0.85);
    --header-blur: saturate(180%) blur(20px);

    --bp-sm: 640px;
    --bp-md: 768px;
    --bp-lg: 1024px;
    --bp-xl: 1280px;
    --bp-2xl: 1536px;
  }

  html, body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-size: var(--text-md);
    line-height: var(--leading-normal);
    letter-spacing: var(--tracking-normal);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  a { color: inherit; text-decoration: none; }
  input { font-family: inherit; }

  /* === global mobile fixes (review 001) === */
  button, .btn, .pill-btn, .icon-btn {
    white-space: nowrap;
  }
  /* タッチ床 44px は主要アクション（pill/icon ボタン）に限定する。
     裸の button まで一律に伸ばすと、フィルタチップは膨張してデスクトップより大きく見え、
     正方形のチェックボックス(.note-check)は縦長に潰れる。チップ・選択チェックは
     各々で適切な最小高さを明示するため、ここでは対象を絞る。 */
  @media (max-width: 639px) {
    .pill-btn,
    .icon-btn,
    a.pill-btn,
    [role="button"] {
      min-height: 44px;
    }
    .icon-btn {
      min-width: 44px;
    }
  }
  .doc-title, h1, .page-title, .note-title, .modal-title {
    overflow-wrap: anywhere;
    word-break: break-word;
    min-width: 0;
  }

  :focus-visible {
    outline: none;
    box-shadow: var(--shadow-focus);
    border-radius: inherit;
  }

  .header {
    position: sticky;
    top: 0;
    z-index: 50;
    height: var(--header-height);
    background: var(--header-bg);
    backdrop-filter: var(--header-blur);
    -webkit-backdrop-filter: var(--header-blur);
    padding: 0 var(--container-padding);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-5);
  }
  @supports not (backdrop-filter: blur(1px)) {
    .header { background: var(--color-bg); }
  }
  .logo {
    display: flex;
    align-items: center;
    font-size: 21px;
    font-weight: var(--weight-light);
    letter-spacing: var(--tracking-tightest);
    color: var(--color-ink);
  }
  .header-link {
    font-size: var(--text-sm);
    color: var(--color-ink-secondary);
    padding: var(--space-2) var(--space-3);
    border-radius: var(--radius-md);
    transition: var(--transition-color), var(--transition-bg);
  }
  .header-link:hover { color: var(--color-ink); background: var(--color-surface); }

  .auth-shell {
    min-height: calc(100vh - var(--header-height));
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: var(--space-10) var(--space-4) var(--space-16);
  }
  .auth-card {
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
  }
  .auth-title {
    font-size: var(--text-3xl);
    font-weight: var(--weight-regular);
    letter-spacing: var(--tracking-tightest);
    line-height: var(--leading-tight);
    color: var(--color-ink);
    margin-bottom: var(--space-2);
  }
  .auth-subtitle {
    font-size: var(--text-sm);
    color: var(--color-ink-secondary);
    margin-bottom: var(--space-8);
    line-height: var(--leading-normal);
  }

  .form { display: flex; flex-direction: column; gap: var(--space-5); }
  .field { display: flex; flex-direction: column; gap: var(--space-2); }
  .field-label {
    font-size: var(--text-sm);
    color: var(--color-ink-secondary);
    font-weight: var(--weight-medium);
  }
  .input {
    width: 100%;
    height: 44px;
    border: none;
    background: var(--color-surface);
    border-radius: var(--radius-md);
    padding: 0 var(--space-4);
    font-size: var(--text-md);
    color: var(--color-ink);
    outline: none;
    transition: var(--transition-bg), box-shadow var(--duration-fast) var(--ease-standard);
  }
  .input::placeholder { color: var(--color-ink-tertiary); }
  .input:hover { background: var(--color-surface-hover); }
  .input:focus-visible { background: var(--color-bg); box-shadow: var(--shadow-focus); }
  .field.has-error .input {
    background: var(--color-error-surface);
    box-shadow: inset 0 0 0 1px var(--color-error);
  }
  .field.has-error .input:focus-visible {
    box-shadow: inset 0 0 0 1px var(--color-error), var(--shadow-focus);
  }
  .field-hint {
    font-size: var(--text-xs);
    color: var(--color-ink-tertiary);
  }
  .field.has-error .field-hint { color: var(--color-error); }

  .btn-primary {
    width: 100%;
    height: 48px;
    border-radius: var(--radius-pill);
    background: var(--color-accent);
    color: #fff;
    font-size: var(--text-md);
    font-weight: var(--weight-medium);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition-bg);
  }
  .btn-primary:hover { background: var(--color-accent-hover); }
  .btn-primary:active { background: var(--color-accent-pressed); }

  .auth-footer {
    margin-top: var(--space-8);
    text-align: center;
    font-size: var(--text-sm);
    color: var(--color-ink-secondary);
  }
  .auth-footer a { color: var(--color-accent); }
  .auth-footer a:hover { text-decoration: underline; text-underline-offset: 3px; }

  /* Alert — 案D: 白地 + セマンティック枠 + アイコン + 見出し + 本文 */
  .alert {
    --alert-accent: var(--color-accent);
    display: flex;
    align-items: flex-start;
    gap: var(--space-3);
    padding: var(--space-4);
    border-radius: var(--radius-lg);
    background: var(--color-bg);
    border: 1px solid color-mix(in oklab, var(--alert-accent) 30%, transparent);
    box-shadow: var(--shadow-xs);
    text-align: left;
    margin-top: var(--space-6);
  }
  .alert-info { --alert-accent: var(--color-info); }
  .alert-success { --alert-accent: var(--color-success); }
  .alert-warning { --alert-accent: var(--color-warning); }
  .alert-error { --alert-accent: var(--color-error); }
  .alert-icon { color: var(--alert-accent); flex-shrink: 0; margin-top: 1px; }
  .alert-content { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; }
  .alert-title { margin: 0; font-size: var(--text-sm); font-weight: var(--weight-semibold); letter-spacing: -0.01em; color: var(--alert-accent); }
  .alert-body { margin: 0; font-size: var(--text-sm); color: var(--color-ink-secondary); line-height: var(--leading-relaxed); }
  .alert-body strong { color: var(--color-ink); font-weight: var(--weight-medium); }

  @media (min-width: 640px) {
    .auth-shell { padding: var(--space-16) var(--space-6) var(--space-20); }
  }
  @media (min-width: 1024px) {
    .auth-shell { padding-top: var(--space-20); }
  }
</style>
</head>
<body>

<header class="header">
  <a href="#" class="logo"><svg xmlns="http://www.w3.org/2000/svg" height="16" viewBox="-5 -1 480 86" role="img" aria-label="hollow"><g transform="translate(-14.57,-27.72) scale(5.83)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="9" cy="12" r="6.5"/><circle cx="15" cy="12" r="6.5"/></g><path transform="translate(150.77,0.00) scale(0.11)" fill="currentColor" d="M70.00 365.00Q89.00 324.00 133.00 300.00Q177.00 276.00 227.00 276.00Q316.00 276.00 360.50 329.00Q405.00 382.00 405.00 469.00L405.00 756.00L337.00 756.00L337.00 497.00Q337.00 460.00 331.00 430.00Q325.00 400.00 310.50 378.50Q296.00 357.00 271.50 345.00Q247.00 333.00 210.00 333.00Q183.00 333.00 157.50 344.00Q132.00 355.00 112.00 377.50Q92.00 400.00 80.00 434.50Q68.00 469.00 68.00 516.00L68.00 756.00L0.00 756.00L0.00 0.00L68.00 0.00L68.00 365.00ZM1046.00 522.00Q1046.00 575.00 1027.50 620.00Q1009.00 665.00 976.00 698.00Q943.00 731.00 897.00 749.50Q851.00 768.00 796.00 768.00Q742.00 768.00 696.00 749.50Q650.00 731.00 617.00 698.00Q584.00 665.00 565.50 620.00Q547.00 575.00 547.00 522.00Q547.00 469.00 565.50 424.00Q584.00 379.00 617.00 346.00Q650.00 313.00 696.00 294.50Q742.00 276.00 796.00 276.00Q851.00 276.00 897.00 294.50Q943.00 313.00 976.00 346.00Q1009.00 379.00 1027.50 424.00Q1046.00 469.00 1046.00 522.00ZM974.00 522.00Q974.00 483.00 961.50 448.50Q949.00 414.00 926.00 388.50Q903.00 363.00 870.00 348.00Q837.00 333.00 796.00 333.00Q755.00 333.00 722.50 348.00Q690.00 363.00 667.00 388.50Q644.00 414.00 631.50 448.50Q619.00 483.00 619.00 522.00Q619.00 561.00 631.50 595.50Q644.00 630.00 667.00 655.50Q690.00 681.00 722.50 695.50Q755.00 710.00 796.00 710.00Q837.00 710.00 870.00 695.50Q903.00 681.00 926.00 655.50Q949.00 630.00 961.50 595.50Q974.00 561.00 974.00 522.00ZM1262.00 756.00L1194.00 756.00L1194.00 0.00L1262.00 0.00ZM1514.00 756.00L1446.00 756.00L1446.00 0.00L1514.00 0.00ZM2161.00 522.00Q2161.00 575.00 2142.50 620.00Q2124.00 665.00 2091.00 698.00Q2058.00 731.00 2012.00 7   <a href="#" class="header-link">ログイン</a>
</header>

<main class="auth-shell">
  <div class="auth-card">
    <h1 class="auth-title">パスワードを再設定</h1>
    <p class="auth-subtitle">登録済みのメールアドレスを入力してください。再設定用のリンクをお送りします。<br>セキュリティ上の理由から、入力されたアドレスが登録済みかどうかはお伝えできません。</p>

    <form class="form" novalidate>
      <div class="field">
        <label class="field-label" for="email">メールアドレス</label>
        <input class="input" id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        <span class="field-hint">登録時に使用したアドレスを入力してください。</span>
      </div>

      <button type="submit" class="btn-primary">再設定リンクを送る</button>
    </form>

    <div class="alert" role="note">
      <span class="alert-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></span>
      <div class="alert-content">
        <p class="alert-title">メールが届かないときは</p>
        <p class="alert-body">迷惑メールフォルダもご確認ください。それでも届かない場合は、別のアドレスで登録されている可能性があります。</p>
      </div>
    </div>

    <div class="auth-footer">
      <a href="#">ログインに戻る</a>
    </div>
  </div>
</main>

</body>
</html>
