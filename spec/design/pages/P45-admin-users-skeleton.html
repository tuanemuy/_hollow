<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hollow Admin — ユーザー管理（読み込み中）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-accent: oklch(37.1% 0 0); --color-accent-hover: oklch(43.9% 0 0); --color-accent-pressed: oklch(26.9% 0 0);
    --color-accent-surface: oklch(97% 0 0); --color-accent-ink: oklch(26.9% 0 0);
    --color-bg: #ffffff; --color-surface: #f5f5f7; --color-surface-hover: #ececef; --color-surface-elevated: #fbfbfd;
    --color-ink: #1d1d1f; --color-ink-secondary: #6e6e73; --color-ink-tertiary: #86868b;
    --color-hairline: rgba(60,60,67,0.12); --color-hairline-strong: rgba(60,60,67,0.18);
    --color-success: #1f8f3a; --color-success-surface: #e6f4ea;
    --color-warning: #a8580b; --color-warning-surface: #fdf3e7;
    --color-error: #c43e3e; --color-error-surface: #fbebeb;
    --color-info: var(--color-accent);
    --color-status-private: #86868b; --color-status-link: #a8580b; --color-status-public: #1f8f3a;
    --code-keyword: #aa3e3e; --code-string: #2a8c4f; --code-comment: var(--color-ink-tertiary); --code-function: #5b3da1; --code-number: #1d6fd6;
    --font-sans: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    --font-mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    --font-heading: var(--font-sans); --font-body: var(--font-sans);
    --text-xs: clamp(11px, 0.7vw + 9px, 12px); --text-sm: clamp(12px, 0.8vw + 10px, 13px); --text-base: clamp(14px, 1vw + 11px, 16px); --text-md: clamp(15px, 1vw + 12px, 17px); --text-lg: clamp(17px, 1.2vw + 13px, 19px); --text-xl: clamp(20px, 1.4vw + 14px, 24px); --text-2xl: clamp(24px, 2vw + 16px, 30px); --text-3xl: clamp(22px, 4vw, 40px); --text-mono: clamp(12.5px, 0.6vw + 11px, 13.5px);
    --weight-light: 300; --weight-regular: 400; --weight-medium: 500; --weight-semibold: 600;
    --leading-tight: 1.2; --leading-snug: 1.35; --leading-normal: 1.5; --leading-relaxed: 1.7;
    --tracking-tightest: -0.022em; --tracking-tighter: -0.014em; --tracking-tight: -0.008em; --tracking-normal: -0.003em;
    --space-0: 0; --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px; --space-12: 48px; --space-16: 64px; --space-20: 80px;
    --container-max: 1280px; --container-padding: clamp(16px, 4vw, 32px);
    --sidebar-width: 260px; --meta-rail-width: 260px; --content-max: 760px; --header-height: 64px;
    --radius-xs: 4px; --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px; --radius-xl: 16px; --radius-pill: 980px; --radius-full: 9999px;
    --shadow-none: none; --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); --shadow-sm: 0 2px 8px rgba(0,0,0,0.06); --shadow-md: 0 8px 24px rgba(0,0,0,0.08); --shadow-focus: 0 0 0 4px oklch(37.1% 0 0 / 0.28);
    --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); --ease-decel: cubic-bezier(0, 0, 0.2, 1); --ease-accel: cubic-bezier(0.4, 0, 1, 1);
    --duration-fast: 120ms; --duration-base: 180ms; --duration-slow: 280ms;
    --transition-default: all var(--duration-base) var(--ease-standard);
    --transition-bg: background-color var(--duration-fast) var(--ease-standard);
    --transition-color: color var(--duration-fast) var(--ease-standard);
    --header-bg: rgba(255,255,255,0.85); --header-blur: saturate(180%) blur(20px);
    --bp-sm: 640px; --bp-md: 768px; --bp-lg: 1024px; --bp-xl: 1280px; --bp-2xl: 1536px;
  }
  html, body { background: var(--color-bg); color: var(--color-ink); font-family: var(--font-sans); font-size: var(--text-md); line-height: var(--leading-normal); letter-spacing: var(--tracking-normal); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }


  /* === global mobile fixes (review 001) === */
  button, .btn, .pill-btn, .icon-btn {
    white-space: nowrap;
  }
  @media (max-width: 639px) {
    button,
    .pill-btn,
    .icon-btn,
    a.pill-btn,
    [role="button"] {
      min-height: 44px;
    }
    .icon-btn {
      min-width: 44px;
    }
  }
  .doc-title, h1, .page-title, .note-title, .modal-title {
    overflow-wrap: anywhere;
    word-break: break-word;
    min-width: 0;
  }
  a { color: inherit; text-decoration: none; }
  ul, ol { list-style: none; }
  input, textarea, select { font-family: inherit; color: inherit; }
  :focus-visible { outline: none; box-shadow: var(--shadow-focus); border-radius: inherit; }

  .header { position: sticky; top: 0; z-index: 50; background: var(--header-bg); backdrop-filter: var(--header-blur); -webkit-backdrop-filter: var(--header-blur); height: var(--header-height); padding: 0 24px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: var(--space-5); }
  @supports not (backdrop-filter: blur(1px)) { .header { background: #ffffff; } }
  .header-left { display: flex; align-items: center; gap: var(--space-3); }
  .logo { font-size: 21px; font-weight: var(--weight-light); letter-spacing: var(--tracking-tightest); }
  .admin-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--radius-pill); background: var(--color-accent-surface); color: var(--color-accent-ink); font-size: var(--text-xs); font-weight: var(--weight-medium); }
  .admin-pill::before { content: ""; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--color-accent); }
  .search { max-width: 460px; width: 100%; margin: 0 auto; position: relative; }
  .search input { width: 100%; height: 36px; border: none; background: var(--color-surface); border-radius: var(--radius-pill); padding: 0 16px 0 38px; font-size: var(--text-sm); outline: none; transition: var(--transition-bg); }
  .search input::placeholder { color: var(--color-ink-tertiary); }
  .search input:focus { background: var(--color-surface-hover); }
  .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--color-ink-tertiary); pointer-events: none; }
  .header-right { display: flex; align-items: center; gap: var(--space-2); }
  .icon-btn { width: 36px; height: 36px; border-radius: var(--radius-full); background: var(--color-surface); display: inline-flex; align-items: center; justify-content: center; transition: var(--transition-bg); }
  .icon-btn:hover { background: var(--color-surface-hover); }
  .avatar { width: 32px; height: 32px; border-radius: var(--radius-full); background: linear-gradient(135deg, #c9d3df 0%, #8e99a8 100%); color: #fff; font-size: 12px; font-weight: var(--weight-medium); display: inline-flex; align-items: center; justify-content: center; }
  .menu-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-md); }
  .menu-btn:hover { background: var(--color-surface); }

  .admin-nav { position: sticky; top: var(--header-height); z-index: 40; background: rgba(255,255,255,0.9); backdrop-filter: var(--header-blur); -webkit-backdrop-filter: var(--header-blur); border-bottom: 1px solid var(--color-hairline); height: 44px; overflow-x: auto; scrollbar-width: none; }
  .admin-nav::-webkit-scrollbar { display: none; }
  .admin-nav-inner { max-width: var(--container-max); margin: 0 auto; padding: 0 var(--container-padding); height: 100%; display: flex; gap: var(--space-1); align-items: center; white-space: nowrap; }
  .admin-nav a { height: 32px; padding: 0 12px; display: inline-flex; align-items: center; border-radius: var(--radius-md); font-size: var(--text-sm); color: var(--color-ink-secondary); transition: var(--transition-bg), var(--transition-color); }
  .admin-nav a:hover { background: var(--color-surface); color: var(--color-ink); }
  .admin-nav a.active { color: var(--color-ink); font-weight: var(--weight-medium); background: var(--color-surface); }

  .main { max-width: var(--container-max); margin: 0 auto; padding: var(--space-10) var(--container-padding) var(--space-20); }
  .page-title { font-size: var(--text-3xl); font-weight: var(--weight-regular); letter-spacing: var(--tracking-tightest); line-height: var(--leading-tight); margin-bottom: var(--space-2); }
  .page-subtitle { font-size: var(--text-md); color: var(--color-ink-secondary); margin-bottom: var(--space-8); }

  .btn { height: 36px; padding: 0 16px; border-radius: var(--radius-pill); background: var(--color-surface); font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--color-ink); display: inline-flex; align-items: center; gap: 6px; transition: var(--transition-bg); }
  .btn:hover { background: var(--color-surface-hover); }
  .btn.primary { background: var(--color-accent); color: #fff; }
  .btn.primary:hover { background: var(--color-accent-hover); }
  .btn.ghost { background: transparent; }
  .btn.ghost:hover { background: var(--color-surface); }
  .btn.destructive { background: transparent; color: var(--color-ink-secondary); }
  .btn.destructive:hover { background: var(--color-error-surface); color: var(--color-error); }
  .btn.sm { height: 28px; padding: 0 12px; font-size: var(--text-xs); }
  .btn.sm svg { width: 16px; height: 16px; }

  /* Filters (実装: surface 塗り入力、検索＋状態のみ。ストレージフィルタ無し) */
  .filters {
    display: flex; gap: var(--space-3); margin-bottom: var(--space-5); flex-wrap: wrap; align-items: center;
  }
  .filter-input {
    height: 40px;
    border: none;
    border-radius: var(--radius-md);
    background: var(--color-surface);
    padding: 0 12px;
    font-size: var(--text-sm);
    color: var(--color-ink);
    min-width: 200px;
    outline: none;
  }
  .filter-input:focus { outline: none; }

  /* Empty state row */
  .empty-cell { text-align: center; color: var(--color-ink-tertiary); padding: var(--space-6) var(--space-4); }

  /* Table */
  .table-wrap { border: 1px solid var(--color-hairline); border-radius: var(--radius-lg); overflow: hidden; }
  .table-scroll { overflow-x: auto; }
  .table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); min-width: 880px; }
  .table th, .table td { padding: var(--space-3) var(--space-4); text-align: left; vertical-align: middle; white-space: nowrap; }
  .table thead th { font-weight: var(--weight-medium); color: var(--color-ink-secondary); background: var(--color-surface-elevated); border-bottom: 1px solid var(--color-hairline); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.04em; }
  .table tbody tr.row-main { border-top: 1px solid var(--color-hairline); }
  .table tbody tr:first-child { border-top: none; }
  .table tbody tr.row-main:hover { background: var(--color-surface-elevated); }
  .table .user-cell { display: flex; align-items: flex-start; gap: 10px; }
  .table .user-avatar { width: 30px; height: 30px; margin-top: 1px; border-radius: var(--radius-full); background: linear-gradient(135deg, #c9d3df 0%, #8e99a8 100%); color: #fff; font-size: 11px; font-weight: var(--weight-medium); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .table .user-handle { color: var(--color-ink); font-weight: var(--weight-medium); }
  .table .user-sub { color: var(--color-ink-tertiary); font-size: var(--text-xs); margin-top: 1px; }

  .tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: var(--radius-pill); background: var(--color-surface); font-size: var(--text-xs); color: var(--color-ink-secondary); font-weight: var(--weight-medium); }
  .tag.active { background: var(--color-success-surface); color: var(--color-success); }
  .tag.pending { background: var(--color-accent-surface); color: var(--color-accent-ink); }
  .tag.suspended { background: var(--color-warning-surface); color: var(--color-warning); }
  .tag.deleted { background: var(--color-error-surface); color: var(--color-error); }
  .tag.role-admin { background: var(--color-accent-surface); color: var(--color-accent-ink); }

  .row-actions { display: flex; gap: var(--space-2); justify-content: flex-end; flex-wrap: wrap; }

  /* === Skeleton (P13a と同一パターンを流用: .skeleton-bar + .w75/.w50/.w66) ===
     P13a はモーダル中央寄せの skeleton。ここではテーブルセル内で左寄せに使うため
     skeleton-bar に微細な pulse を足す（reduced-motion で無効化）。命名・surface 塗りは踏襲。 */
  .skeleton-bar {
    height: 12px;
    background: var(--color-surface);
    border-radius: var(--radius-sm);
    margin: var(--space-2) auto;
    animation: skeleton-pulse 1.4s var(--ease-standard) infinite;
  }
  .skeleton-bar.w75 { width: 75%; }
  .skeleton-bar.w50 { width: 50%; }
  .skeleton-bar.w66 { width: 66%; }
  @keyframes skeleton-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }

  /* テーブルセル内の左寄せ skeleton 配置（surface 矩形＋上記 pulse を流用） */
  .sk-cell { display: flex; align-items: flex-start; gap: 10px; }
  .sk-bar { margin: 0; }                       /* 左寄せのため auto マージンを解除 */
  .sk-avatar { width: 30px; height: 30px; margin-top: 1px; border-radius: var(--radius-full); background: var(--color-surface); flex-shrink: 0; animation: skeleton-pulse 1.4s var(--ease-standard) infinite; }
  .sk-lines { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .sk-pill { height: 18px; border-radius: var(--radius-pill); }   /* role / status の pill skeleton */
  .sk-actions { display: flex; gap: var(--space-2); justify-content: flex-end; }
  .sk-btn { height: 28px; border-radius: var(--radius-pill); }    /* btn.sm 相当のアクション skeleton */

  @media (max-width: 640px) { .header { padding: 0 16px; gap: 10px; } .logo { display: none; } }
  @media (min-width: 1024px) { .menu-btn { display: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; } }
</style>
</head>
