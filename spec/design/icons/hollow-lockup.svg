<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 32" fill="none">
  <!-- Hollow — 横組みロックアップ。Vesica mark + wordmark（Avenir Next / lowercase / weight 400）
       注: wordmark は system font 参照。本番では Avenir Next をアウトライン化して埋め込むこと。 -->
  <g transform="translate(2,4)" stroke="#1d1d1f" stroke-width="1.5" stroke-linecap="round">
    <circle cx="9" cy="12" r="6.5"/>
    <circle cx="15" cy="12" r="6.5"/>
  </g>
  <text x="36" y="23" font-family="'Avenir Next','Avenir',-apple-system,sans-serif" font-size="23" font-weight="400" letter-spacing="-0.5" fill="#1d1d1f">hollow</text>
</svg>
