# LOCAL DEV ONLY — `pnpm dev` / `pnpm build` auto-discover this file via
# `@cloudflare/vite-plugin`. Do NOT run `wrangler deploy` against it:
# the resource names below lack the stage suffix that keeps environments
# from colliding. Deploy via `wrangler.staging.toml` / `wrangler.production.toml`.
#
# Sibling Workers are declared as `[env.*]` named environments below so
# they can be spun up locally with `wrangler dev --env <role>`.
#
# Wrangler does NOT inherit `d1_databases` / `vars` from top level into
# named environments — the duplication across `[env.*]` blocks is by
# design. Keep `database_id` / `APP_URL` in sync across every block.
name = "hollow-local"
main = "app/server.cloudflare.ts"
compatibility_date = "2026-05-01"
# `nodejs_compat` is required because @tanstack/react-start imports
# `node:async_hooks` / `node:stream` / `node:crypto` / `node:util`.
compatibility_flags = ["nodejs_compat"]

# Static assets produced by `vite build` (`dist/client`).
[assets]
directory = "./dist/client"
binding = "ASSETS"

[vars]
APP_URL = "http://localhost:8787"
# Bucket name used by `R2ObjectStorage` to mint SigV4 presigned URLs.
# Public information (S3 endpoint URL is exposed in presigned links
# anyway), so it lives in `[vars]` rather than `.dev.vars`. See ADR-006.
R2_OBJECT_BUCKET_NAME = "hollow-local-objects"
# LOCAL DEV ONLY — point presigned URLs at the same-origin dev proxy so
# the presigned upload/download flow completes E2E against the local
# miniflare `OBJECT_STORAGE` binding (no CORS preflight, no store
# mismatch with finalize's `stat`). Do NOT add these two vars to
# `wrangler.staging.toml` / `wrangler.production.toml`: staging /
# production must keep presigning against the remote R2 S3 endpoint and
# must not serve objects through the Worker. See
# docs/runtime_cloudflare.md "ローカルでの presigned フロー".
R2_S3_ENDPOINT = "http://localhost:8787/dev/r2"
R2_DEV_OBJECT_PROXY = "true"
# LOCAL DEV ONLY — under `pnpm start` (`wrangler dev`) the relay /
# consumer Workers are not running, so this enables `InlineRelayTrigger`
# to drain the outbox inside the main Worker's isolate. Takes effect
# only with a `pnpm build:local` artifact; after a plain `pnpm build`
# the inline path is DCE'd and this var is silently inert. Do NOT add it
# to `wrangler.staging.toml` / `wrangler.production.toml` — it would be
# inert there too, but keeping it out makes the intent unambiguous. See
# docs/runtime_cloudflare.md "Local dev outbox dispatch".
DEV_INLINE_RELAY = "true"
# Sender address used by `ResendEmailSender` when `RESEND_API_KEY` is
# also set. Local dev keeps the secret unset so DI stays on
# `ConsoleEmailSender`; this dummy value is wired only so the typed
# `EMAIL_FROM` field is present for parity with staging/production.
# Production deploys must point at a Resend-verified domain.
# See `.issue/197/adr.md` ADR-005.
EMAIL_FROM = "noreply@example.com"
# Model id consumed by `AnthropicLLMProvider`. Public information.
# DI wires `AnthropicLLMProvider` only when this AND
# `ADMIN_LLM_API_KEY` (secret) are both present.
ADMIN_LLM_MODEL = "claude-3-5-sonnet-latest"
# Provider id consumed by the LLM / OCR / PDF factories
# (`app/core/application/di/llmProviderFactory.ts`). When unset the
# factories default to `"anthropic"`, matching the pre-#122 behaviour.
ADMIN_LLM_PROVIDER = "anthropic"
# Optional base URL override consumed by the OpenAI-compatible adapter
# (`app/core/adapters/openai/*`). Only meaningful when
# `ADMIN_LLM_PROVIDER = "openai"`; empty string → use the provider's
# default endpoint. Anthropic / Gemini providers ignore this value
# (ADR-001). Public information so it ships via `[vars]`.
ADMIN_LLM_BASE_URL = ""
# Model id consumed by the OpenAI speech (transcription) adapter. Public
# information. DI wires the real speech adapter only when this AND
# `ADMIN_SPEECH_API_KEY` (secret — never put in `[vars]`) are both present;
# either missing → `StubSpeechRecognitionProvider`.
ADMIN_SPEECH_MODEL = "gpt-4o-transcribe"
# Provider id consumed by the speech registry factory. "openai" is the only
# supported provider for now. There is no `ADMIN_SPEECH_BASE_URL` — the
# speech config carries no base URL override.
ADMIN_SPEECH_PROVIDER = "openai"

# D1: read/write for the request path. Outbox writes happen here
# transactionally with aggregate writes — see app/core/adapters/d1/.
[[d1_databases]]
binding = "DB"
database_name = "hollow-local-d1"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "app/core/adapters/d1/migrations"

# R2 buckets — DI swaps in `R2TempFileStorage` / `R2ObjectStorage` when
# the bindings are present, otherwise the DI fallback installs an
# inline unavailable adapter that rejects every call with the
# appropriate `*UnavailableError` (see `serverCloudflare.ts`
# `createUnavailable*` factories and `.issue/100/adr.md` ADR-001).
[[r2_buckets]]
binding = "TEMP_FILES"
bucket_name = "hollow-local-temp-files"

[[r2_buckets]]
binding = "OBJECT_STORAGE"
bucket_name = "hollow-local-objects"

# Service Binding to the relay Worker — kicked from usecases right
# after a UoW commit so newly-persisted outbox rows publish without
# waiting for the safety-net cron in [env.relay]. Failures are logged
# and swallowed; the cron is the authoritative trigger.
[[services]]
binding = "RELAY"
service = "hollow-local-relay"

# Cloudflare Workers AI binding (Issue #788). Required by the keyless
# `deepgram-workers-ai` speech provider — authentication is handled by
# Cloudflare, so no API key var is needed. LOCAL DEV NOTE: `wrangler dev` has
# no AI mock; the binding proxies to the real Workers AI endpoint and needs
# real Cloudflare account authentication, so keyless transcription only works
# locally when authenticated against a real account. Absent binding → DI falls
# back to the Stub speech provider.
[ai]
binding = "AI"


# === Relay (Service Binding fetch + safety-net cron) ====================
[env.relay]
name = "hollow-local-relay"
main = "app/worker/cloudflare/relay.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[env.relay.vars]
APP_URL = "http://localhost:8787"
# Outbox relay tuning. Strings because wrangler `[vars]` cannot carry
# numeric types; parsed + validated at the worker entry boundary by
# `readRelayTuning(env)`. Values match the application-layer defaults
# exported from `app/core/application/workers/eventRelayWorker.ts`.
# Edit here (not in code) to tune prod / staging.
OUTBOX_BATCH_SIZE = "100"
OUTBOX_LEASE_MS = "300000"   # 5 min — covers worst-case single-batch dispatch
OUTBOX_MAX_ATTEMPTS = "2"    # multiplied by [env.consumer] max_retries — keep low

[[env.relay.d1_databases]]
binding = "DB"
database_name = "hollow-local-d1"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "app/core/adapters/d1/migrations"

[[env.relay.queues.producers]]
binding = "EVENTS_QUEUE"
queue = "hollow-local-events"

# Cron is the safety net — the primary trigger is the RELAY service
# binding fired from usecases after each UoW commit. 5 minutes is a
# trade-off between recovery latency on a Service Binding outage and
# the per-cron-tick request cost.
[env.relay.triggers]
crons = ["*/5 * * * *"]


# === Consumer ===========================================================
[env.consumer]
name = "hollow-local-consumer"
main = "app/worker/cloudflare/consumer.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[env.consumer.vars]
APP_URL = "http://localhost:8787"
# Wrangler does NOT inherit `vars` / `r2_buckets` / `services` from the
# top level into named environments — these are duplicated on purpose.
R2_OBJECT_BUCKET_NAME = "hollow-local-objects"
ADMIN_LLM_MODEL = "claude-3-5-sonnet-latest"
ADMIN_LLM_PROVIDER = "anthropic"
ADMIN_LLM_BASE_URL = ""
# Speech (transcription) provider config — `ADMIN_SPEECH_API_KEY` is a
# secret and is never placed in `[vars]` (no base URL override exists).
ADMIN_SPEECH_MODEL = "gpt-4o-transcribe"
ADMIN_SPEECH_PROVIDER = "openai"

# D1 is bound for subscribers that write projections / idempotency
# stamps. Drop if your consumers are stateless.
[[env.consumer.d1_databases]]
binding = "DB"
database_name = "hollow-local-d1"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "app/core/adapters/d1/migrations"

# R2 buckets — the consumer dispatches into `runIngestionJob` /
# `runExportJob` which touch temp file storage and object storage
# directly. Bindings are duplicated from the top level because wrangler
# does not inherit them into named environments.
[[env.consumer.r2_buckets]]
binding = "TEMP_FILES"
bucket_name = "hollow-local-temp-files"

[[env.consumer.r2_buckets]]
binding = "OBJECT_STORAGE"
bucket_name = "hollow-local-objects"

# Service Binding to relay — enables `ServiceBindingRelayTrigger` so
# secondary domain events emitted by `runIngestionJob` / `runExportJob`
# publish immediately rather than waiting for the 5-min cron.
[[env.consumer.services]]
binding = "RELAY"
service = "hollow-local-relay"

# Cloudflare Workers AI binding (Issue #788). Audio transcription runs in the
# consumer, so the keyless `deepgram-workers-ai` provider needs the binding
# HERE for the E2E path. Same local-dev caveat as the top-level `[ai]` block:
# no local mock; proxies to real Workers AI with real account auth. Absent →
# keyless provider degrades to the Stub.
[env.consumer.ai]
binding = "AI"

[[env.consumer.queues.consumers]]
queue = "hollow-local-events"
max_batch_size = 25
max_batch_timeout = 30 # seconds
# Total delivery budget: relay's `DEFAULT_MAX_ATTEMPTS = 2` (publish-side
# retries before quarantine) × consumer `1 + max_retries` here ≈ 8 in
# the worst case. Keep both numbers small and adjust together —
# multiplying them is what produces the user-visible retry count.
max_retries = 3
dead_letter_queue = "hollow-local-events-dlq"


# === Indexer ============================================================
# Drains the `index_jobs` table through `consumeIndexJob`, applying
# upsert / delete ops to `search_documents`. Producer side is the queue
# consumer's note.* / publication.* dispatch (Issue #145). DLQ rows
# (`attempts >= 3`) are excluded by `nextBatch`'s `maxAttempts` filter
# and stay in `index_jobs` for admin re-drive.
[env.indexer]
name = "hollow-local-indexer"
main = "app/worker/cloudflare/indexer.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[env.indexer.vars]
APP_URL = "http://localhost:8787"
# Indexer tuning. Parsed at the worker entry boundary by
# `readIndexerTuning(env)`. Defaults declared in
# `app/core/application/workers/processIndexJobs.ts`.
INDEXER_BATCH_SIZE = "50"
INDEXER_MAX_BATCHES = "20"

[[env.indexer.d1_databases]]
binding = "DB"
database_name = "hollow-local-d1"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "app/core/adapters/d1/migrations"

# Same 5-minute cadence as the relay's safety-net cron. Per-row idempotency
# (`SearchIndex.upsert` keyed on noteId, `SearchIndex.delete` no-op on
# missing row) absorbs the at-least-once `nextBatch` semantics if a tick
# overlaps with the previous one.
[env.indexer.triggers]
crons = ["*/5 * * * *"]


# === Pruner =============================================================
# Quarantined outbox rows (`failed_at IS NOT NULL`) are intentionally
# preserved for operator inspection — the pruner only sweeps processed
# rows.
[env.pruner]
name = "hollow-local-pruner"
main = "app/worker/cloudflare/pruner.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[env.pruner.vars]
APP_URL = "http://localhost:8787"
# Outbox pruner tuning. Parsed + validated at the worker entry boundary
# by `readPruneTuning(env)`. Matches `DEFAULT_OUTBOX_RETENTION_MS` in
# `app/core/application/workers/outboxPrune.ts`.
OUTBOX_RETENTION_MS = "604800000"   # 7 days
# Idempotency-record (`processed_events`) retention. Must exceed the
# queue's max redelivery window so dedup stays correct — 14 days is the
# Cloudflare Queues message-retention ceiling, so it outlives any
# `message_retention_period`. Matches `DEFAULT_PROCESSED_EVENTS_RETENTION_MS`
# in `app/core/application/workers/pruneProcessedEvents.ts` (Issue #747).
PROCESSED_EVENTS_RETENTION_MS = "1209600000"   # 14 days
# Terminal `export_jobs` row retention (`failed` / `cancelled` / `expired`;
# `completed` is excluded — its artifact lifecycle is owned by the expired
# purge). Matches `DEFAULT_EXPORT_JOBS_RETENTION_MS` in
# `app/core/application/workers/pruneExportJobs.ts` (Issue #783).
EXPORT_JOBS_RETENTION_MS = "604800000"   # 7 days
# Terminal `tag_merge_jobs` row retention (`completed` / `failed`). Matches
# `DEFAULT_TAG_MERGE_JOBS_RETENTION_MS` in
# `app/core/application/workers/pruneTagMergeJobs.ts` (Issue #783).
TAG_MERGE_JOBS_RETENTION_MS = "604800000"   # 7 days
# Object-storage bucket name consulted by `createRequestContainer` when
# building the purge container (Issue #783 ADR-005). Required for purge to
# actually delete expired R2 artifacts — see the `OBJECT_STORAGE` binding
# below.
R2_OBJECT_BUCKET_NAME = "hollow-local-objects"

[[env.pruner.d1_databases]]
binding = "DB"
database_name = "hollow-local-d1"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "app/core/adapters/d1/migrations"

# The pruner now drives `purgeExpiredExports` (Issue #783 ADR-005), which
# deletes expired export artifacts from R2. Mirrors the `[env.consumer]`
# binding (same bucket). The three SigV4 presign secrets
# (`R2_ACCOUNT_ID` / `R2_ACCESS_KEY_ID` / `R2_SECRET_ACCESS_KEY`) are
# injected at deploy time via SOPS, never placed in `[vars]`. If the
# binding or any presign secret is missing, `createRequestContainer` falls
# back to an unavailable objectStorage whose `delete` throws
# `StorageUnavailableError` — purge's per-row catch keeps the tick running
# but the artifact is left orphaned, so production must supply all of them.
[[env.pruner.r2_buckets]]
binding = "OBJECT_STORAGE"
bucket_name = "hollow-local-objects"

[env.pruner.triggers]
crons = ["0 3 * * *"] # 03:00 UTC daily


# === DLQ ================================================================
# DLQ intentionally has no dead-letter target — a re-failure here
# would loop. `max_retries` is therefore kept low to absorb a transient
# logger/projection blip without masquerading as automated recovery.
[env.dlq]
name = "hollow-local-dlq"
main = "app/worker/cloudflare/dlq.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[env.dlq.vars]
APP_URL = "http://localhost:8787"

# D1 mirrors the primary consumer for subscribers that persist
# quarantined events. Drop if your DLQ handler stays purely log/metric.
[[env.dlq.d1_databases]]
binding = "DB"
database_name = "hollow-local-d1"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "app/core/adapters/d1/migrations"

[[env.dlq.queues.consumers]]
queue = "hollow-local-events-dlq"
max_batch_size = 25
max_batch_timeout = 30 # seconds
max_retries = 1
