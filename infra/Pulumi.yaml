name: hollow
runtime:
  name: nodejs
  options:
    packagemanager: pnpm
    typescript: true
description: |
  Hollow — Cloudflare infrastructure (D1, Queues, R2, DNS).
  Worker scripts and Worker Routes are deployed by wrangler from CI;
  this stack provisions everything Workers depend on and emits the IDs /
  names that the wrangler config templates consume.
main: src/index.ts
